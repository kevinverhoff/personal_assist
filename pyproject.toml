[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "email-agent"
version = "0.1.0"
description = "Personal Email Intelligence Agent: Gmail ingestion, Gemini classification, Notion knowledge-base reconciliation, and digesting."
requires-python = ">=3.11"
dependencies = [
    "python-dotenv>=1.0.1",
    "google-auth>=2.35.0",
    "google-auth-oauthlib>=1.2.1",
    "google-api-python-client>=2.140.0",
    "google-genai>=1.2.0",
    "requests>=2.32.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.0"]

[tool.setuptools.packages.find]
where = ["src"]
